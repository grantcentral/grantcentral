name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Cross-compiled with MinGW; OpenSSL is built from source.
          - { os: ubuntu-latest, target: x86_64-pc-windows-gnu }
          # macOS needs Apple's SDK, so it builds on a Mac (both arches from one runner).
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --workspace --target ${{ matrix.target }} --features grantcentral-core/vendored-openssl
      - uses: actions/upload-artifact@v4
        with:
          name: grantcentral-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/grantcentral
            target/${{ matrix.target }}/release/grantcentral.exe
