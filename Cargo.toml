[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/grantcentral/grantcentral"

[workspace.dependencies]
grantcentral-core = { path = "crates/core", version = "0.0.4" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
open = "5"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
