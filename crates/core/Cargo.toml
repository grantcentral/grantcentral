[package]
name = "grantcentral-core"
description = "Flow engine, file model and OAuth 2.0 protocol implementation for GrantCentral"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["chromium"]
# Headless Chromium login driver for CI pipelines.
chromium = ["dep:chromiumoxide"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
open.workspace = true
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc"] }
base64 = "0.22"
chromiumoxide = { version = "0.9", optional = true }
futures = "0.3"
keyring = "4"
minijinja = { version = "3", features = ["serde", "json", "builtins", "urlencode"] }
reqwest = { version = "0.13", features = ["json", "form", "cookies"] }
rustls-pki-types = { version = "1.9", features = ["alloc"] }
schemars = "1"
toml = "1"
url = "2"

[dev-dependencies]
wiremock = "0.6"
