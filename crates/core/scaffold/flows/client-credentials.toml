#:schema ../.grantcentral/schema/flow.json
name = "Client credentials, introspection and revocation"

[[steps]]
type = "discover"

[[steps]]
type = "token"
grant_type = "client_credentials"
assert = ["status == 200"]

[[steps]]
type = "introspect"
when = "session.metadata.introspection_endpoint"
assert = ["body.active"]

[[steps]]
type = "revoke"
when = "session.metadata.revocation_endpoint"

[[steps]]
name = "revoked token is inactive"
type = "introspect"
when = "session.metadata.introspection_endpoint and session.metadata.revocation_endpoint"
assert = ["body.active == false"]
