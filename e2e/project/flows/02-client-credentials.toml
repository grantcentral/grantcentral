name = "Client credentials, introspection and revocation (RFC 6749 §4.4, RFC 7662, RFC 9701, RFC 7009)"
tags = ["smoke"]

[client]
client_id = "gc-confidential"
client_secret = "{{ secrets.confidential_secret }}"

[[steps]]
type = "discover"

[[steps]]
id = "cc"
type = "token"
grant_type = "client_credentials"
assert = ["status == 200", "body.token_type == 'Bearer'"]

[[steps]]
type = "request"
url = "{{ api }}/hello"
assert = ["status == 200", "body.ok"]

[[steps]]
type = "introspect"
assert = ["body.active == true", "body.client_id == 'gc-confidential'"]

[[steps]]
name = "introspection as a signed JWT (RFC 9701)"
type = "introspect"
jwt_response = true
assert = ["body.active == true", "jwt.header.typ == 'token-introspection+jwt'"]

[[steps]]
type = "revoke"
token = "{{ steps.cc.body.access_token }}"

[[steps]]
name = "revoked token is inactive"
type = "introspect"
assert = ["body.active == false"]
