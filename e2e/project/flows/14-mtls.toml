name = "Mutual TLS client authentication and certificate-bound tokens (RFC 8705)"

[client]
client_id = "gc-mtls"
auth_method = "self_signed_tls_client_auth"
# Generated by e2e/run.sh.
tls_cert = "keys/generated/client.crt"
tls_key = "keys/generated/client.key"
ca_cert = "keys/generated/ca.crt"

[[steps]]
type = "discover"
assert = ["body.mtls_endpoint_aliases.token_endpoint"]

[[steps]]
type = "token"
grant_type = "client_credentials"
assert = ["status == 200"]

[[steps]]
name = "the token is bound to the certificate"
type = "introspect"
assert = ["body.active", "body.cnf['x5t#S256'] == session.cert_thumbprint"]
